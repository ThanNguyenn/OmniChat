services:
    backend:
        build:
            context: .
            dockerfile: OmniChat.Api/Dockerfile
        container_name: omnichat-backend
        ports:
            - "5000:80"
        environment:
            - ASPNETCORE_ENVIRONMENT=Production
            - REDIS_HOST=redis
            - REDIS_PORT=6379
        depends_on:
            - redis

    redis:
        image: redis:7
        container_name: omnichat-redis
        ports:
            - "6379:6379"
