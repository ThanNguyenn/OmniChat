services:
    backend:
        build:
            context: .
            dockerfile: OmniChat.Api/Dockerfile
        container_name: omnichat-backend
        ports:
            - "5000:80"
        environment:
            - ASPNETCORE_ENVIRONMENT=Production
            - REDIS=redis:6379
        depends_on:
            - redis
        restart: always

    redis:
        image: redis:7
        container_name: omnichat-redis
        ports:
            - "6379:6379"
        restart: always
