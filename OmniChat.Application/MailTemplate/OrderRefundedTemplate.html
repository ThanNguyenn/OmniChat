<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
</head>
<body style="font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px;">
    <div style="max-width: 600px; margin: 0 auto; background-color: #ffffff; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.05); border: 1px solid #e1e8ed;">
        <div style="background-color: #0ea5e9; padding: 30px; text-align: center;">
            <h1 style="color: #ffffff; margin: 0; font-size: 24px; font-weight: 600;">Thông Báo Hoàn Tiền</h1>
        </div>
        <div style="padding: 30px; color: #333333; line-height: 1.6;">
            <p style="font-size: 16px; margin-top: 0;">Xin chào <strong>{{CustomerName}}</strong>,</p>
            <p style="font-size: 15px;">Chúng tôi đã thực hiện hoàn tiền thành công cho đơn hàng bị hoàn trả của bạn.</p>
            <div style="background-color: #f8fafc; border-left: 4px solid #0ea5e9; padding: 15px; margin: 20px 0; border-radius: 4px;">
                <p style="margin: 5px 0; font-size: 14px; color: #64748b;">Mã đơn hàng:</p>
                <p style="margin: 5px 0; font-size: 18px; font-weight: bold; color: #1e293b;">{{OrderCode}}</p>
                <p style="margin: 10px 0 5px 0; font-size: 14px; color: #64748b;">Số tiền hoàn trả:</p>
                <p style="margin: 5px 0; font-size: 18px; font-weight: bold; color: #0284c7;">{{RefundAmount}} VND</p>
            </div>
            <p style="font-size: 14px; color: #64748b; margin-bottom: 0;">Tiền sẽ được cộng lại vào ví của bạn trong thời gian sớm nhất.</p>
        </div>
        <div style="background-color: #f8fafc; padding: 20px; text-align: center; font-size: 12px; color: #94a3b8; border-top: 1px solid #e2e8f0;">
            <p style="margin: 0;">© 2026 OmniChat. All rights reserved.</p>
        </div>
    </div>
</body>
</html>
