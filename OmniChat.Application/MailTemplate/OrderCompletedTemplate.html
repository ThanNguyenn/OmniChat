<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
</head>
<body style="font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px;">
    <div style="max-width: 600px; margin: 0 auto; background-color: #ffffff; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.05); border: 1px solid #e1e8ed;">
        <div style="background-color: #10b981; padding: 30px; text-align: center;">
            <h1 style="color: #ffffff; margin: 0; font-size: 24px; font-weight: 600;">Đơn Hàng Đã Hoàn Thành</h1>
        </div>
        <div style="padding: 30px; color: #333333; line-height: 1.6;">
            <p style="font-size: 16px; margin-top: 0;">Xin chào Quý khách,</p>
            <p style="font-size: 15px;">OmniChat xin thông báo đơn hàng của bạn đã chính thức hoàn thành tốt đẹp.</p>
            <div style="background-color: #f8fafc; border-left: 4px solid #10b981; padding: 15px; margin: 20px 0; border-radius: 4px;">
                <p style="margin: 5px 0; font-size: 14px; color: #64748b;">Tên đơn hàng:</p>
                <p style="margin: 5px 0; font-size: 16px; font-weight: bold; color: #1e293b;">{{OrderName}}</p>
                <p style="margin: 10px 0 5px 0; font-size: 14px; color: #64748b;">Trạng thái hệ thống:</p>
                <p style="margin: 5px 0; font-size: 15px; font-weight: bold; color: #10b981;">Completed (Thành công)</p>
            </div>
            <p style="font-size: 15px; font-weight: 500; color: #4f46e5; text-align: center; margin: 25px 0 10px 0;">Cảm ơn bạn đã đồng hành và sắm sửa cùng chúng tôi! ❤️</p>
        </div>
        <div style="background-color: #f8fafc; padding: 20px; text-align: center; font-size: 12px; color: #94a3b8; border-top: 1px solid #e2e8f0;">
            <p style="margin: 0;">© 2026 OmniChat. All rights reserved.</p>
        </div>
    </div>
</body>
</html>
